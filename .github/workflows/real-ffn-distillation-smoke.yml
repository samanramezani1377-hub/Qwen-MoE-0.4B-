name: Real Qwen FFN distillation (CPU smoke run)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distill-one-layer:
    # Public-repository GitHub-hosted runner; no HF Jobs/GPU service is provisioned.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate safetensors

      - name: Create tiny Persian smoke corpus
        run: |
          mkdir -p data
          cat > data/fa_smoke.txt <<'EOF'
          سلام، این یک نمونه متن فارسی برای آزمایش مدل است.
          هوش مصنوعی می‌تواند متن را تحلیل کند و به پرسش‌ها پاسخ دهد.
          برای ساخت مدل محلی باید کیفیت، حافظه و سرعت را هم‌زمان سنجید.
          یادگیری ماشین با داده‌های مناسب می‌تواند الگوهای زبانی را بیاموزد.
          EOF

      - name: Distil one real Qwen FFN on CPU
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python scripts/distill_real_qwen_ffn.py             --text-file data/fa_smoke.txt             --layer 0 --samples 4 --max-length 16             --num-experts 8 --top-k 2 --epochs 1             --batch-size 1 --device cpu             --output artifacts/layer0_top2_smoke.pt

      - name: Upload experimental checkpoint and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-real-ffn-distillation-smoke
          path: |
            artifacts/layer0_top2_smoke.pt
            data/fa_smoke.txt
          if-no-files-found: warn
          retention-days: 7
