name: Persian corpus FFN distillation (CPU experiment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip and Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface/hub
            ~/.cache/huggingface/datasets
          key: ubuntu-py311-qwen-moe-cache-v1
          restore-keys: |
            ubuntu-py311-qwen-moe-cache-

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate safetensors datasets
      - name: Collect Persian Wikipedia samples
        env:
          SAMPLE_COUNT: ${{ inputs.samples || '64' }}
        run: |
          python - <<'PY'
          import os
          from datasets import load_dataset
          count = max(8, min(256, int(os.environ["SAMPLE_COUNT"])))
          stream = load_dataset("wikimedia/wikipedia", "20231101.fa", split="train", streaming=True)
          os.makedirs("data", exist_ok=True)
          written = 0
          with open("data/fa_wikipedia.txt", "w", encoding="utf-8") as f:
              for row in stream:
                  text = " ".join(str(row.get("text", "")).split())
                  if len(text) < 160:
                      continue
                  f.write(text[:4000] + "\n")
                  written += 1
                  if written >= count:
                      break
          if written < 8:
              raise RuntimeError(f"Only collected {written} usable Persian samples")
          print(f"Collected {written} Persian Wikipedia samples")
          PY
      - name: Distil one real Qwen FFN on Persian text
        env:
          EPOCHS: ${{ inputs.epochs || '2' }}
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p artifacts
          python scripts/distill_real_qwen_ffn.py \
            --text-file data/fa_wikipedia.txt \
            --layer 0 --samples ${{ inputs.samples || '64' }} --max-length 96 \
            --num-experts 8 --top-k 2 --epochs ${{ inputs.epochs || '2' }} \
            --batch-size 1 --device cpu \
            --output artifacts/layer0_persian_wikipedia_top2.pt
      - name: Upload checkpoint and corpus metadata
        uses: actions/upload-artifact@v4
        with:
          name: qwen-persian-wikipedia-ffn-experiment
          path: |
            artifacts/layer0_persian_wikipedia_top2.pt
            data/fa_wikipedia.txt
          retention-days: 7
