name: Persian FFN scale-up (CPU)

on:
  push:
    paths:
      - ".github/workflows/persian-wikipedia-scale.yml"

permissions:
  contents: read

jobs:
  distill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate safetensors datasets
      - name: Collect 256 Persian Wikipedia samples
        run: |
          python - <<'PY'
          from datasets import load_dataset
          import os
          os.makedirs("data", exist_ok=True)
          stream = load_dataset("wikimedia/wikipedia", "20231101.fa", split="train", streaming=True)
          count = 0
          with open("data/fa_wikipedia.txt", "w", encoding="utf-8") as f:
              for row in stream:
                  body = " ".join(str(row.get("text", "")).split())
                  if len(body) < 160:
                      continue
                  f.write(body[:4000] + "\n")
                  count += 1
                  if count >= 256:
                      break
          if count < 256:
              raise RuntimeError(f"Expected 256 samples, got {count}")
          print(f"Collected {count} Persian samples")
          PY
      - name: Train and evaluate one real FFN layer
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p artifacts
          python scripts/distill_real_qwen_ffn.py \
            --text-file data/fa_wikipedia.txt \
            --layer 0 --samples 256 --max-length 96 \
            --num-experts 8 --top-k 2 --epochs 3 \
            --batch-size 1 --device cpu \
            --output artifacts/layer0_persian_wikipedia_top2_256x3.pt
      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qwen-persian-wikipedia-scale-up
          path: |
            artifacts/layer0_persian_wikipedia_top2_256x3.pt
            data/fa_wikipedia.txt
          retention-days: 7
