name: Kaggle API connection check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-kaggle-secret:
    name: Verify Kaggle API authentication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle

      - name: Check Kaggle authentication without exposing the token
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KAGGLE_API_TOKEN:-}" ]]; then
            echo "::error::Repository secret KAGGLE_API_TOKEN is missing or unavailable to this workflow."
            exit 1
          fi
          # Never print the secret. A successful authenticated list request confirms API access.
          kaggle datasets list -p 1 >/tmp/kaggle-datasets.txt
          echo "Kaggle API authentication succeeded."
          head -n 8 /tmp/kaggle-datasets.txt
