name: Qwen MoE unified pipeline

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "docs/**"
      - "notebooks/**"
      - "README-project.md"
      - ".github/workflows/qwen-moe-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-moe-unified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile project scripts
        run: python -m py_compile scripts/audit_model.py scripts/moe_ffn_prototype.py scripts/test_qwen_ffn_transfer.py scripts/distill_real_qwen_ffn.py scripts/collect_persian_wikipedia.py

  synthetic-moe:
    name: Synthetic MoE correctness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip and model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface/hub
          key: ubuntu-py311-qwen-moe-cache-v1
          restore-keys: |
            ubuntu-py311-qwen-moe-cache-
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Test synthetic channel-sharded FFN equivalence and sparse dispatch
        run: python scripts/moe_ffn_prototype.py

  qwen-weight-transfer:
    name: Real Qwen weight transfer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip and model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface/hub
          key: ubuntu-py311-qwen-moe-cache-v1
          restore-keys: |
            ubuntu-py311-qwen-moe-cache-
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Test channel-sharded FFN with real Qwen layer-0 weights
        run: python scripts/test_qwen_ffn_transfer.py

  metadata-audit:
    name: Model metadata audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run model metadata and safetensors header audit
        run: python scripts/audit_model.py --output audit-report.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: qwen-model-audit-report
          path: audit-report.json
          if-no-files-found: error
          retention-days: 14

  smoke-distillation:
    name: Tiny real-FFN smoke training
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip and Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface/hub
          key: ubuntu-py311-qwen-moe-cache-v1
          restore-keys: |
            ubuntu-py311-qwen-moe-cache-
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate safetensors
      - name: Create tiny Persian smoke corpus
        run: |
          mkdir -p data
          cat > data/fa_smoke.txt <<'EOF'
          سلام، این یک نمونه متن فارسی برای آزمایش مدل است.
          هوش مصنوعی می‌تواند متن را تحلیل کند و به پرسش‌ها پاسخ دهد.
          برای ساخت مدل محلی باید کیفیت، حافظه و سرعت را هم‌زمان سنجید.
          یادگیری ماشین با داده‌های مناسب می‌تواند الگوهای زبانی را بیاموزد.
          EOF
      - name: Distil one real Qwen FFN on CPU
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          mkdir -p artifacts
          python scripts/distill_real_qwen_ffn.py \
            --text-file data/fa_smoke.txt \
            --layer 0 --samples 4 --max-length 16 \
            --num-experts 8 --top-k 2 --epochs 1 \
            --batch-size 1 --device cpu \
            --output artifacts/layer0_top2_smoke.pt
      - name: Upload smoke checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: qwen-real-ffn-distillation-smoke
          path: artifacts/layer0_top2_smoke.pt
          if-no-files-found: error
          retention-days: 7

  persian-distillation:
    name: Persian Wikipedia FFN training
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip and Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface/hub
            ~/.cache/huggingface/datasets
          key: ubuntu-py311-qwen-moe-cache-v1
          restore-keys: |
            ubuntu-py311-qwen-moe-cache-
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate safetensors requests
      - name: Collect Persian Wikipedia samples with offline fallback
        timeout-minutes: 8
        run: |
          mkdir -p data
          if python scripts/collect_persian_wikipedia.py \
            --count 64 --min-chars 160 --max-chars 4000 \
            --max-requests 8 --timeout 20 \
            --output data/fa_wikipedia.txt; then
            echo "Using collected Persian Wikipedia samples."
          else
            echo "::warning::Wikipedia API collection was rate-limited or unavailable; falling back to the checked-in Persian smoke corpus."
            cat > data/fa_wikipedia.txt <<'EOF'
          سلام، این یک نمونه متن فارسی برای آزمایش مدل است.
          هوش مصنوعی می‌تواند متن را تحلیل کند و به پرسش‌ها پاسخ دهد.
          برای ساخت مدل محلی باید کیفیت، حافظه و سرعت را هم‌زمان سنجید.
          یادگیری ماشین با داده‌های مناسب می‌تواند الگوهای زبانی را بیاموزد.
          زبان فارسی دارای ساختار دستوری، واژگان و شیوه نگارش ویژه‌ای است.
          مدل‌های زبانی با دیدن نمونه‌های متنوع می‌توانند نمایش‌های آماری متن را یاد بگیرند.
          پردازش زبان طبیعی برای خلاصه‌سازی، ترجمه، پاسخ‌گویی و دسته‌بندی متن کاربرد دارد.
          اجرای محلی مدل می‌تواند داده‌های کاربر را روی دستگاه نگه دارد و به اینترنت وابسته نباشد.
          کیفیت داده آموزشی بر رفتار مدل اثر می‌گذارد و داده تکراری تنوع یادگیری را کاهش می‌دهد.
          ارزیابی مدل باید جدا از داده آموزش انجام شود تا خطای تعمیم بهتر سنجیده شود.
          در مدل‌های ترکیبی، مسیریاب تصمیم می‌گیرد هر توکن به کدام متخصص‌ها فرستاده شود.
          انتخاب دو متخصص از میان هشت متخصص می‌تواند محاسبات فعال را کاهش دهد.
          فشرده‌سازی مدل باید با سنجش دقت، سرعت و مصرف حافظه همراه باشد.
          مدل کوچک برای تلفن همراه باید با محدودیت پردازنده و حافظه سازگار باشد.
          متن فارسی ممکن است شامل نیم‌فاصله، نشانه‌گذاری و شکل‌های گوناگون نویسه‌ها باشد.
          داده مناسب باید جمله‌های روشن و نمونه‌های مختلف از موضوعات عمومی داشته باشد.
          یادگیری نظارت‌شده از نمونه‌های ورودی و خروجی برای اصلاح رفتار مدل استفاده می‌کند.
          در تقطیر دانش، مدل کوچک‌تر می‌کوشد رفتار مدل بزرگ‌تر را تقریب بزند.
          خطای میان خروجی مدل و هدف آموزشی می‌تواند با معیار میانگین مربعات سنجیده شود.
          استفاده از بذر ثابت به بازتولیدپذیری آزمایش‌های یادگیری ماشین کمک می‌کند.
          آزمایش روی یک لایه به‌تنهایی اثبات نمی‌کند که کل مدل آماده استفاده است.
          برای استقرار واقعی، همه لایه‌ها، توکن‌ساز و پیکربندی باید هماهنگ باشند.
          مدل آفلاین باید پیش از انتشار از نظر کیفیت، مجوز و امنیت بررسی شود.
          معماری متخصص‌های پراکنده بخشی از شبکه را برای هر ورودی فعال می‌کند.
          کاهش پارامترهای فعال الزاماً به معنی کاهش همه هزینه‌های حافظه نیست.
          وزن‌های مدل ممکن است در قالب فایل‌های امن و بخش‌بندی‌شده ذخیره شوند.
          گزارش آزمایش باید اندازه داده، تعداد گام‌ها و معیار ارزیابی را ثبت کند.
          محاسبات روی پردازنده معمولاً از شتاب‌دهنده کندتر است اما می‌تواند رایگان باشد.
          نمونه‌های کوتاه‌تر زمان آزمایش را کاهش می‌دهند ولی همه توانایی‌های زبان را نمی‌سنجند.
          مدل‌های چندزبانه برای زبان فارسی نیز به داده باکیفیت نیاز دارند.
          پیش‌پردازش متن شامل پاک‌سازی فاصله‌ها و حذف نمونه‌های بسیار کوتاه است.
          در جمع‌آوری داده باید محدودیت سرویس و شرایط استفاده رعایت شود.
          وقتی یک سرویس درخواست‌ها را محدود می‌کند، باید مکث کرد و فشار را افزایش نداد.
          آزمایش موفق نرم‌افزاری با اثبات کیفیت پاسخ‌های واقعی تفاوت دارد.
          برای سنجش مدل باید مجموعه ارزیابی مستقل و پرسش‌های متنوع تهیه کرد.
          مدل‌های کوچک ممکن است در استدلال چندمرحله‌ای خطا کنند.
          نتیجه یک آزمایش اولیه باید به‌عنوان شاهد مقدماتی گزارش شود.
          آموزش روی داده اندک بیشتر برای آزمودن مسیر فنی مناسب است تا آموزش عمومی.
          مدل‌های زبانی احتمال توالی توکن‌ها را با استفاده از زمینه پیش‌بینی می‌کنند.
          توکن‌ساز متن را به شناسه‌هایی تبدیل می‌کند که شبکه عصبی پردازش می‌کند.
          طول زمینه بیشتر می‌تواند مصرف حافظه و زمان محاسبه را افزایش دهد.
          اندازه دسته آموزشی بر میزان حافظه و پایداری بهینه‌سازی اثر می‌گذارد.
          نرخ یادگیری نامناسب ممکن است باعث ناپایداری یا پیشرفت کند شود.
          گرادیان‌ها جهت تغییر پارامترها را برای کاهش خطای آموزشی مشخص می‌کنند.
          برش گرادیان می‌تواند اندازه گرادیان‌های بسیار بزرگ را محدود کند.
          وزن‌دهی متخصص‌ها تعیین می‌کند خروجی هر متخصص چه سهمی داشته باشد.
          مسیریاب باید در طول آموزش به انتخاب‌های مفید برای توکن‌ها نزدیک شود.
          تقسیم کانال‌های لایه میانی راهی برای ساخت متخصص‌های اولیه از وزن‌های موجود است.
          این تقسیم اولیه تضمین نمی‌کند متخصص‌ها از نظر معنایی تخصص پیدا کرده باشند.
          برای تخصص واقعی به داده کافی و آموزش و ارزیابی مناسب نیاز است.
          بازتولید نتیجه به نسخه کتابخانه‌ها و تنظیمات محیط هم وابسته است.
          ثبت نسخه مدل و کد برای پیگیری آزمایش‌ها اهمیت دارد.
          پیش از استفاده عملی باید سرعت تولید توکن روی دستگاه هدف اندازه‌گیری شود.
          مصرف رم هنگام بارگذاری وزن‌ها با تعداد پارامترهای فعال یکسان نیست.
          کم‌کردن محاسبات هر توکن می‌تواند به کاهش تأخیر کمک کند اما تضمینی نیست.
          کیفیت پاسخ فارسی باید با ارزیابی انسانی و آزمون‌های استاندارد سنجیده شود.
          متن‌های عمومی به‌تنهایی برای پوشش همه حوزه‌های تخصصی کافی نیستند.
          استفاده از داده تکراری ممکن است باعث حفظ‌کردن متن به‌جای یادگیری الگو شود.
          خروجی مدل باید از نظر خطاهای factual و پاسخ‌های ساختگی بررسی شود.
          پژوهش قابل اتکا محدودیت‌ها و شکست‌های آزمایش را نیز مستند می‌کند.
          هدف این نمونه فقط آزمایش مسیر آموزش روی پردازنده و وزن واقعی مدل است.
          این مجموعه جایگزین پیکره بزرگ و معتبر فارسی برای آموزش کامل نیست.
          EOF
          fi
      - name: Train and evaluate one real FFN layer
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p artifacts
          python scripts/distill_real_qwen_ffn.py \
            --text-file data/fa_wikipedia.txt \
            --layer 0 --samples 64 --max-length 96 \
            --num-experts 8 --top-k 2 --epochs 2 \
            --batch-size 1 --device cpu \
            --output artifacts/layer0_persian_top2_experiment.pt
      - name: Upload Persian experiment
        uses: actions/upload-artifact@v4
        with:
          name: qwen-persian-ffn-experiment
          path: |
            artifacts/layer0_persian_top2_experiment.pt
            data/fa_wikipedia.txt
          if-no-files-found: error
          retention-days: 7

  sync-to-huggingface:
    name: Sync source to Hugging Face
    runs-on: ubuntu-latest
    needs:
      - syntax
      - synthetic-moe
      - qwen-weight-transfer
      - metadata-audit
      - smoke-distillation
      - persian-distillation
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Sync project source files to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN}" ]; then
            echo "Missing repository secret HF_TOKEN."
            exit 1
          fi
          git clone "https://mrSpaser:${HF_TOKEN}@huggingface.co/mrSpaser/Qwen-MoE-0.4B" hf-model
          mkdir -p hf-model/scripts hf-model/notebooks hf-model/docs
          rsync -a --delete scripts/ hf-model/scripts/
          rsync -a --delete notebooks/ hf-model/notebooks/
          rsync -a --delete docs/ hf-model/docs/
          if [ -f README-project.md ]; then
            cp README-project.md hf-model/README-project.md
          else
            rm -f hf-model/README-project.md
          fi
          rm -f hf-model/سلام.txt
          cd hf-model
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to sync."
          else
            git commit -m "chore: sync project files from GitHub"
            git push
          fi
