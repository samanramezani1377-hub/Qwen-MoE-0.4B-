name: Qwen MoE unified pipeline

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "docs/**"
      - "notebooks/**"
      - "README-project.md"
      - ".github/workflows/qwen-moe-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-moe-unified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile project scripts
        run: python -m py_compile scripts/audit_model.py scripts/moe_ffn_prototype.py scripts/test_qwen_ffn_transfer.py scripts/distill_real_qwen_ffn.py scripts/collect_persian_corpus.py scripts/split_persian_corpus.py scripts/validate_moe_experiment.py scripts/sweep_moe_budgets.py scripts/evaluate_model_outputs.py

  synthetic-moe:
    name: Synthetic MoE correctness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip and model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface/hub
          key: ubuntu-py311-qwen-moe-cache-v1
          restore-keys: |
            ubuntu-py311-qwen-moe-cache-
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Test synthetic channel-sharded FFN equivalence and sparse dispatch
        run: python scripts/moe_ffn_prototype.py

  qwen-weight-transfer:
    name: Real Qwen weight transfer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip and model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface/hub
          key: ubuntu-py311-qwen-moe-cache-v1
          restore-keys: |
            ubuntu-py311-qwen-moe-cache-
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Test channel-sharded FFN with real Qwen layer-0 weights
        run: python scripts/test_qwen_ffn_transfer.py

  metadata-audit:
    name: Model metadata audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run model metadata and safetensors header audit
        run: python scripts/audit_model.py --output audit-report.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: qwen-model-audit-report
          path: audit-report.json
          if-no-files-found: error
          retention-days: 14

  smoke-distillation:
    name: Tiny real-FFN smoke training
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip and Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface/hub
          key: ubuntu-py311-qwen-moe-cache-v1
          restore-keys: |
            ubuntu-py311-qwen-moe-cache-
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate safetensors
      - name: Create tiny Persian smoke corpus
        run: |
          mkdir -p data
          cat > data/fa_smoke.txt <<'EOF'
          سلام، این یک نمونه متن فارسی برای آزمایش مدل است.
          هوش مصنوعی می‌تواند متن را تحلیل کند و به پرسش‌ها پاسخ دهد.
          برای ساخت مدل محلی باید کیفیت، حافظه و سرعت را هم‌زمان سنجید.
          یادگیری ماشین با داده‌های مناسب می‌تواند الگوهای زبانی را بیاموزد.
          EOF
      - name: Distil one real Qwen FFN on CPU
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
        run: |
          mkdir -p artifacts
          python scripts/distill_real_qwen_ffn.py \
            --text-file data/fa_smoke.txt \
            --layer 0 --samples 4 --max-length 16 \
            --num-experts 32 --top-k 2 --epochs 1 \
            --batch-size 1 --device cpu \
            --benchmark-warmup 1 --benchmark-repeats 3 \
            --output artifacts/layer0_top2_smoke.pt
      - name: Upload smoke checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: qwen-real-ffn-distillation-smoke
          path: |
            artifacts/layer0_top2_smoke.pt
            artifacts/layer0_top2_smoke.benchmark.json
          if-no-files-found: error
          retention-days: 7

  persian-distillation:
    name: Persian dataset FFN training + active-budget sweep
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip and Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface/hub
            ~/.cache/huggingface/datasets
          key: ubuntu-py311-qwen-moe-cache-v1
          restore-keys: |
            ubuntu-py311-qwen-moe-cache-
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers accelerate safetensors datasets
      - name: Collect 64 real Persian samples from Hugging Face datasets
        timeout-minutes: 20
        run: |
          mkdir -p data
          python scripts/collect_persian_corpus.py \
            --count 64 --min-chars 160 --max-chars 4000 --max-scan 12000 \
            --output data/fa_persian_corpus.txt \
            --manifest-output data/fa_persian_corpus.manifest.json
          python - <<'PY'
          import json
          p = json.load(open("data/fa_persian_corpus.manifest.json", encoding="utf-8"))
          assert p["status"] == "success" and p["collected_samples"] == 64
          assert p["fallback_used"] is False or p["dataset"] == "ErfanMoosaviMonazzah/mOSCAR-Persian"
          print("Verified real corpus:", p["dataset"], p["collected_samples"], "samples")
          PY
      - name: Split whole Persian documents into train and independent evaluation sets
        run: |
          python scripts/split_persian_corpus.py \
            --input data/fa_persian_corpus.txt \
            --train-output data/fa_train_documents.txt \
            --eval-output data/fa_eval_documents.txt \
            --manifest-output data/fa_document_split.manifest.json \
            --eval-fraction 0.15 --seed 20261025
      - name: Train one real FFN layer on training documents only
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p artifacts
          python scripts/distill_real_qwen_ffn.py \
            --text-file data/fa_train_documents.txt \
            --layer 0 --samples 64 --max-length 96 \
            --num-experts 32 --top-k 2 --epochs 2 \
            --batch-size 1 --device cpu \
            --benchmark-warmup 3 --benchmark-repeats 12 \
            --output artifacts/layer0_persian_top2_experiment.pt
      - name: Evaluate on held-out Persian documents, baselines, memory, and parameter counts
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python scripts/validate_moe_experiment.py \
            --checkpoint artifacts/layer0_persian_top2_experiment.pt \
            --eval-text-file data/fa_eval_documents.txt \
            --output artifacts/layer0_persian_validation_report.json \
            --layer 0 --max-length 96 --batch-size 2 --num-experts 32 --top-k 2 \
            --device cpu --warmup 3 --repeats 12
      - name: Evaluate the selected 32-expert top-2 budget on held-out Persian documents
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python scripts/sweep_moe_budgets.py \
            --train-text-file data/fa_train_documents.txt \
            --eval-text-file data/fa_eval_documents.txt \
            --output artifacts/active_budget_sweep.json \
            --layer 0 --experts 32 --top-k 2 \
            --max-length 96 --max-train-token-vectors 1024 \
            --max-eval-token-vectors 2048 --epochs 2 --train-batch-size 32 \
            --device cpu --benchmark-repeats 3
      - name: Compare dense model outputs with the selected layer-0 top-2/32-expert replacement
        env:
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python scripts/evaluate_model_outputs.py \
            --checkpoint artifacts/layer0_persian_top2_experiment.pt \
            --eval-text-file data/fa_eval_documents.txt \
            --output artifacts/model_output_comparison.json \
            --layer 0 --num-experts 32 --top-k 2 --max-length 96 \
            --max-documents 8 --max-new-tokens 16 --device cpu
      - name: Upload Persian experiment and active-budget sweep
        uses: actions/upload-artifact@v4
        with:
          name: qwen-persian-ffn-experiment
          path: |
            artifacts/layer0_persian_top2_experiment.pt
            artifacts/layer0_persian_top2_experiment.benchmark.json
            artifacts/layer0_persian_validation_report.json
            artifacts/active_budget_sweep.json
            artifacts/model_output_comparison.json
            data/fa_persian_corpus.manifest.json
            data/fa_document_split.manifest.json
          if-no-files-found: error
          retention-days: 7

  sync-to-huggingface:
    name: Sync source to Hugging Face
    runs-on: ubuntu-latest
    needs:
      - syntax
      - synthetic-moe
      - qwen-weight-transfer
      - metadata-audit
      - smoke-distillation
      - persian-distillation
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
      - name: Download trained Persian experiment artifact
        uses: actions/download-artifact@v4
        with:
          name: qwen-persian-ffn-experiment
          path: downloaded-persian-artifact
      - name: Configure Git and Git LFS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git lfs install
      - name: Sync project source files to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN}" ]; then
            echo "Missing repository secret HF_TOKEN."
            exit 1
          fi
          git clone "https://mrSpaser:${HF_TOKEN}@huggingface.co/mrSpaser/Qwen-MoE-0.4B" hf-model
          mkdir -p hf-model/scripts hf-model/notebooks hf-model/docs
          rsync -a --delete scripts/ hf-model/scripts/
          rsync -a --delete notebooks/ hf-model/notebooks/
          rsync -a --delete docs/ hf-model/docs/
          if [ -f README-project.md ]; then
            cp README-project.md hf-model/README-project.md
          else
            rm -f hf-model/README-project.md
          fi
          rm -f hf-model/سلام.txt
          mkdir -p hf-model/experiments
          cp downloaded-persian-artifact/artifacts/layer0_persian_top2_experiment.pt hf-model/experiments/layer0_persian_top2_experiment.pt
          cp downloaded-persian-artifact/artifacts/layer0_persian_top2_experiment.benchmark.json hf-model/experiments/layer0_persian_top2_experiment.benchmark.json
          cp downloaded-persian-artifact/artifacts/layer0_persian_validation_report.json hf-model/experiments/layer0_persian_validation_report.json
          cp downloaded-persian-artifact/artifacts/active_budget_sweep.json hf-model/experiments/active_budget_sweep.json
          cp downloaded-persian-artifact/artifacts/model_output_comparison.json hf-model/experiments/model_output_comparison.json
          cp downloaded-persian-artifact/data/fa_persian_corpus.manifest.json hf-model/experiments/persian_corpus.manifest.json
          cp downloaded-persian-artifact/data/fa_document_split.manifest.json hf-model/experiments/persian_document_split.manifest.json
          cat > hf-model/experiments/README.md <<'EOF'
          # Experimental Persian FFN checkpoint

          This is a **single-layer research experiment**, not a complete deployable Qwen MoE model.
          The training corpus is collected from a real Hugging Face Persian text dataset using streaming.
          See `persian_corpus.manifest.json` for dataset, license, sample count, and document provenance.
          The collector has no synthetic fallback: if both real sources fail, the training job fails.

          `layer0_persian_top2_experiment.benchmark.json` records original-FFN versus trained top-2 MoE forward-only timing. `layer0_persian_validation_report.json` adds independent-document evaluation, zero/random-router baselines, relative error, process memory, and parameter accounting. `active_budget_sweep.json` compares 8/16/32/48 experts at top-2 using the same held-out Persian documents and a bounded training sample; it reports layer-output imitation metrics and estimated all-layer active parameter budgets. These are screening results, not end-to-end language quality or Android performance.
          EOF
          cd hf-model
          git lfs track "experiments/*.pt"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to sync."
          else
            git commit -m "chore: sync project files from GitHub"
            git push
          fi
