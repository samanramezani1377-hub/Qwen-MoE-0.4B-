name: Parallel validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Python syntax and imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile project scripts
        run: python -m py_compile scripts/audit_model.py scripts/moe_ffn_prototype.py scripts/test_qwen_ffn_transfer.py scripts/distill_real_qwen_ffn.py

  synthetic-moe:
    name: Synthetic MoE correctness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip and model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface/hub
          key: ubuntu-py311-qwen-moe-cache-v1
          restore-keys: |
            ubuntu-py311-qwen-moe-cache-
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Test synthetic channel-sharded FFN equivalence and sparse dispatch
        run: python scripts/moe_ffn_prototype.py

  qwen-weight-transfer:
    name: Real Qwen weight transfer check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip and model downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface/hub
          key: ubuntu-py311-qwen-moe-cache-v1
          restore-keys: |
            ubuntu-py311-qwen-moe-cache-
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Test channel-sharded FFN with real Qwen layer-0 weights
        run: python scripts/test_qwen_ffn_transfer.py

  metadata-audit:
    name: Model metadata audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run model metadata and safetensors header audit
        run: python scripts/audit_model.py --output audit-report.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: qwen-model-audit-report-parallel
          path: audit-report.json
          if-no-files-found: error
          retention-days: 14
