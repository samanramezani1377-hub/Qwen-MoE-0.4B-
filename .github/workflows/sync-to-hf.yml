name: Sync project files to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync project source files to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN}" ]; then
            echo "Missing repository secret HF_TOKEN."
            exit 1
          fi
          git clone "https://mrSpaser:${HF_TOKEN}@huggingface.co/mrSpaser/Qwen-MoE-0.4B" hf-model
          mkdir -p hf-model/scripts hf-model/notebooks hf-model/docs
          rsync -a --delete scripts/ hf-model/scripts/
          rsync -a --delete notebooks/ hf-model/notebooks/
          rsync -a --delete docs/ hf-model/docs/
          if [ -f README-project.md ]; then
            cp README-project.md hf-model/README-project.md
          else
            rm -f hf-model/README-project.md
          fi
          # Remove the temporary test file from the earlier connectivity check.
          rm -f hf-model/سلام.txt
          cd hf-model
          git add -A -- README-project.md scripts notebooks docs سلام.txt
          if git diff --cached --quiet; then
            echo "No project changes to sync."
          else
            git commit -m "chore: sync project files from GitHub"
            git push
          fi
